stages:
  - build
  - test
  - publish
  - deploy

build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - salle-101
  script:
    - cd backend
    - dotnet restore src/UniSearch.Api/UniSearch.Api.csproj
    - dotnet publish src/UniSearch.Api/UniSearch.Api.csproj -c Release -o publish --no-restore
  artifacts:
    paths:
      - backend/publish/
    expire_in: 1 day

# Check de la compilation du mobile, sans rien garder.
# Expo utilise l'image de node pour compiler.
check_frontend:
  stage: build
  image: node:24-bookworm-slim
  tags:
    - salle-101
  script:
    - cd frontend
    - npm ci
    - npx tsc --noEmit

# On télécharge l'image docker, puis execute docker in docker.
# Dependcies est vide car on ne veux pas télécharger les artefacts du build.
test_backend:
  stage: test
  dependencies: []
  image: docker:29-cli
  tags:
    - salle-101
  services:
    - name: docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache make
    - install -m 600 "$ENV_TEST_FILE" .env.test
  script:
    - make test
  after_script:
    - make test-report
    - make test-down
    - rm -f .env.test
  artifacts:
    when: always
    paths:
      - backend/test-results/
    reports:
      junit: backend/test-results/*.xml

publish_backend:
  stage: publish
  dependencies: []
  image: docker:29-cli
  services:
    - name: docker:29-dind
      command: ["--insecure-registry=${REGISTRY_URL}"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - salle-101
  script:
    - |
      docker build \
        --target prod \
        -t "$REGISTRY_URL/johann-valle/unisearch-api:$CI_COMMIT_SHORT_SHA" \
        -t "$REGISTRY_URL/johann-valle/unisearch-api:latest" \
        -f backend/Dockerfile \
        backend/
    - docker push "$REGISTRY_URL/johann-valle/unisearch-api:$CI_COMMIT_SHORT_SHA"
    - docker push "$REGISTRY_URL/johann-valle/unisearch-api:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "PRO403-223_Pipeline"'

deploy_production:
  stage: deploy
  dependencies: []
  image: alpine:3.20
  tags:
    - salle-101
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - install -m 600 "$ENV_PROD_FILE" .env.prod
  script:
    # Récupération du port de l'API.
    - API_PORT=$(sed -n 's/^API_PORT=//p' .env.prod | tr -d '\r')

    # Transfert des fichiers.
    - |
      scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
        .env.prod docker-compose.yml docker-compose.prod.yml \
        "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

    # Déploiement sur le serveur.
    - |
      ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "set -e
        cd '$DEPLOY_PATH'
        chmod 600 .env.prod

        export APP_VERSION='$CI_COMMIT_SHORT_SHA'
        export REGISTRY_URL='$REGISTRY_URL'

        docker compose -p unisearch-prod \
          --env-file .env.prod \
          -f docker-compose.yml \
          -f docker-compose.prod.yml \
          pull

        docker compose -p unisearch-prod \
          --env-file .env.prod \
          -f docker-compose.yml \
          -f docker-compose.prod.yml \
          up -d --remove-orphans"

    # Vérification de l'API.
    - curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "http://$DEPLOY_HOST:$API_PORT/health"
  rules:
    - if: '$CI_COMMIT_BRANCH == "PRO403-223_Pipeline"'
