stages:
  - build
  - test

build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - salle-101
  script:
    - cd backend
    - dotnet restore src/UniSearch.Api/UniSearch.Api.csproj
    - dotnet publish src/UniSearch.Api/UniSearch.Api.csproj -c Release -o publish --no-restore
  artifacts:
    paths:
      - backend/publish/
    expire_in: 1 day

# Check de la compilation du mobile, sans rien garder.
# Expo utilise l'image de node pour compiler.
check_frontend:
  stage: build
  image: node:24-bookworm-slim
  tags:
    - salle-101
  script:
    - cd frontend
    - npm ci
    - npx tsc --noEmit

test_backend:
  stage: test
  image: docker:29-cli
  tags:
    - salle-101
  services:
    - name: docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache make
    - cp "$ENV_TEST_FILE" .env.test
    - chmod 600 .env.test
  script:
    - make test
  after_script:
    - make test-down
    - rm -f .env.test
