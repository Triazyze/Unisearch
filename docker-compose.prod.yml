services:
  api:
    build: !reset null
    image: 10.6.0.9:5000/johann-valle/unisearch-api:${APP_VERSION}

    environment:
      MONGODB_URI: ${MONGODB_URI}
      ASPNETCORE_HTTP_PORTS: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ENABLED: ${SEED_ENABLED}
      SEED_PLAYER_PASSWORD: ${SEED_PLAYER_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

    ports:
      - "${API_PORT}:${API_PORT}"

  mongodb:
    volumes:
      - mongo_prod:/data/db

    restart: always

volumes:
  mongo_prod:
